# Builds the Windows installer on Windows.
#
# A Windows installer can be cross-built from Linux only up to a point: NSIS and
# rcedit both need Wine, so a Linux box can produce a working zip but not a
# signed, icon-stamped, Start-Menu-installing .exe. This runs on a real Windows
# runner so the artifact is the real thing.
name: windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# Needed only by the release step; the build itself reads nothing privileged.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck, build, and test
        run: |
          npm run build
          node --test dist/test/*.test.js

      # Proves the sim is genuinely headless on Windows too: no window, no GPU,
      # no Electron — just the simulation clearing a zone and checking that
      # offline progression matches live play.
      - name: Headless verification
        run: |
          node dist/src/headless/cli.js parity --hours 0.25,1,4
          node dist/src/headless/cli.js soak --seeds 3
          node dist/src/headless/cli.js balance

      - name: Package
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: cenotaph-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 30

      # On a version tag, attach the real Windows-built executables to a
      # Release. An artifact needs a GitHub login, lives on the Actions page and
      # arrives as one zip of every build variant; a Release is a plain download
      # link. Uses the preinstalled gh CLI rather than a third-party action so
      # there is one less moving part to trust.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # @() so a single match is still an array; ForEach-Object on a bare
          # match would otherwise hand a scalar to the splat below.
          $files = @(Get-ChildItem release -Filter *.exe | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'no executables to publish' }
          $ghArgs = @($env:GITHUB_REF_NAME) + $files + @(
            '--title', "Cenotaph $env:GITHUB_REF_NAME",
            '--notes-file', '.github/RELEASE_NOTES.md',
            '--target', $env:GITHUB_SHA)
          & gh release create @ghArgs

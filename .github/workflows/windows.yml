# Builds the Windows installer on Windows.
#
# A Windows installer can be cross-built from Linux only up to a point: NSIS and
# rcedit both need Wine, so a Linux box can produce a working zip but not a
# signed, icon-stamped, Start-Menu-installing .exe. This runs on a real Windows
# runner so the artifact is the real thing.
name: windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a Release at this tag, e.g. v0.1.0. Blank = build only."
        required: false
        default: ""

# Needed only by the release step; the build itself reads nothing privileged.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Two ways to ask for a release: push a v* tag, or dispatch with a tag
      # name. The second exists because not every actor that can push a branch
      # can push a tag, and `gh release create --target` will create the tag
      # itself. Empty means build only.
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck, build, and test
        run: |
          npm run build
          node --test dist/test/*.test.js

      # Proves the sim is genuinely headless on Windows too: no window, no GPU,
      # no Electron — just the simulation clearing a zone and checking that
      # offline progression matches live play.
      - name: Headless verification
        run: |
          node dist/src/headless/cli.js parity --hours 0.25,1,4
          node dist/src/headless/cli.js soak --seeds 3
          node dist/src/headless/cli.js balance

      - name: Package
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: cenotaph-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 30

      # Attach the real Windows-built executables to a Release. An artifact
      # needs a GitHub login, lives on the Actions page and arrives as one zip
      # of every build variant; a Release is a plain download link. Uses the
      # preinstalled gh CLI rather than a third-party action so there is one
      # less moving part to trust.
      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # GitHub prepends `$ErrorActionPreference = 'stop'` to every pwsh
          # step, which on PowerShell 7.4+ turns any non-zero native exit into
          # a thrown terminating error. That would make the "does this release
          # already exist?" probe below fatal in the ordinary case where it
          # does not. Check $LASTEXITCODE by hand instead.
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $tag = $env:RELEASE_TAG
          # @() so a single match is still an array; a bare pipeline would hand
          # a scalar to the splat below.
          $files = @(Get-ChildItem release -Filter *.exe | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'no executables to publish' }
          Write-Host "publishing $($files.Count) file(s) at $tag"

          gh release view $tag --json id | Out-Null
          $exists = ($LASTEXITCODE -eq 0)

          if ($exists) {
            # Re-runnable: a second run of the same tag replaces the binaries
            # rather than failing on an existing release.
            & gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "upload failed ($LASTEXITCODE)" }
            & gh release edit $tag --title "Cenotaph $tag" --notes-file .github/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw "edit failed ($LASTEXITCODE)" }
          } else {
            # --target creates the tag at this commit if it does not exist.
            $ghArgs = @('create', $tag) + $files + @(
              '--title', "Cenotaph $tag",
              '--notes-file', '.github/RELEASE_NOTES.md',
              '--target', $env:GITHUB_SHA)
            & gh release @ghArgs
            if ($LASTEXITCODE -ne 0) { throw "create failed ($LASTEXITCODE)" }
          }

          $url = (gh release view $tag --json url --jq .url)
          if ($LASTEXITCODE -ne 0) { throw "could not read back the release ($LASTEXITCODE)" }
          Write-Host "release: $url"
          "## [$tag]($url)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
